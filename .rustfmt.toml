# rustfmt configuration.
#
# Only list keys that are BOTH stable on `cargo fmt` AND non-default.
# Nightly-only keys are accepted but silently ignored by stable rustfmt — no warning,
# no error, no effect — so a config file can claim rules that never actually apply.
# The previous version of this file did exactly that: of 12 keys, 9 were rustfmt
# defaults and 3 (`single_line_if_else_max_width`, `struct_lit_width`,
# `struct_variant_width`) were nightly-only and inert.
#
# Verify a change is actually taking effect with:
#   cargo fmt -- --check

# Default is 100.
max_width = 120
