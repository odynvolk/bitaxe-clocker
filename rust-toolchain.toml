[toolchain]
# Single source of truth for the toolchain used in local development, selected
# automatically by rustup. Replaces `.tool-versions`, which named a rust version
# that asdf had no plugin to install.
#
# Not `channel = "1.95.0"`, deliberately: naming an exact version forces every
# machine to download that specific toolchain, and stable is what is actually
# installed here. It also does not apply to the Docker build - the image pins
# `rust:1.85-slim` and .dockerignore keeps this file out of the build context.
channel = "stable"
